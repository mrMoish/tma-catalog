events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    client_max_body_size 12m;

    server {
        listen 80;

        location /api/ {
            set $backend http://backend:8000;
            proxy_pass $backend;
            proxy_set_header Host $host;
        }

        location /tg/webhook {
            set $bot http://bot:8080;
            proxy_pass $bot;
            proxy_set_header Host $host;
        }

        location / {
            set $front http://frontend:3000;
            proxy_pass $front;
            proxy_set_header Host $host;
        }
    }
}
